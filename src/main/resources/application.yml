server:
  port: ${PORT:80}
  error:
    include-message: never
    include-stacktrace: never

spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.session.SessionAutoConfiguration
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_ADDRESS}/${MYSQL_DATABASE}?characterEncoding=UTF-8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
    hikari:
      maximum-pool-size: 5
      connection-timeout: 5000
  sql:
    init:
      mode: never
  mvc:
    view:
      suffix: .html
      prefix: /

mybatis:
  mapper-locations: classpath*:mapper/*Mapper.xml
  configuration:
    map-underscore-to-camel-case: true
    arg-name-based-constructor-auto-mapping: true

app:
  mode: ${APP_MODE:mini}
  admin:
    username: ${ADMIN_USERNAME:}
    password-hash: ${ADMIN_PASSWORD_HASH:}
  wechat:
    appid: ${WECHAT_APPID:}
    auth-mode: ${WECHAT_AUTH_MODE:cloud}
    appsecret: ${WECHAT_APPSECRET:}
    trusted-ingress: ${WECHAT_TRUSTED_INGRESS:false}
